[package]
name = "zk-oracle-host"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "keeper"
path = "src/bin/keeper.rs"

[[bin]]
name = "boundless"
path = "src/bin/boundless.rs"

[[bin]]
name = "wizard"
path = "src/bin/wizard.rs"

[dependencies]
alloy = { workspace = true }
alloy-contract = "1.0"
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
anyhow = { workspace = true }
boundless-market = { version = "1.3" }
clap = { workspace = true }
dotenvy = "0.15"
hex = "0.4"
risc0-ethereum-contracts = { version = "3.0" }
risc0-steel = { workspace = true, features = ["host"] }
risc0-zkvm = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
zk-oracle-methods = { workspace = true }
